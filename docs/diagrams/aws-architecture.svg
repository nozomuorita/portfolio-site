<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">ポートフォリオサイト AWS構成図</title>
  <desc id="desc">閲覧者からCloudFront、非公開S3への配信経路と、GitHub ActionsからOIDC認証でデプロイする管理経路</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2d"/>
      <stop offset="1" stop-color="#102e4d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#67d4ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#62e6ae"/>
    </marker>
    <style>
      .title{font:700 38px 'Segoe UI',sans-serif;fill:#fff}.subtitle{font:400 18px 'Segoe UI',sans-serif;fill:#a9c4d9}
      .zone{fill:#0d243b;stroke:#365a78;stroke-width:2}.box{fill:#132f4b;stroke:#67d4ff;stroke-width:2;filter:url(#shadow)}
      .deploy{stroke:#62e6ae}.future{fill:none;stroke:#829ab0;stroke-width:2;stroke-dasharray:10 8}
      .h{font:700 24px 'Segoe UI',sans-serif;fill:#fff}.t{font:400 17px 'Segoe UI',sans-serif;fill:#d8e8f4}.small{font:400 14px 'Segoe UI',sans-serif;fill:#a9c4d9}
      .label{font:600 15px 'Segoe UI',sans-serif;fill:#8de2ff}.green{fill:#8ff0c8}.arrow{fill:none;stroke:#67d4ff;stroke-width:4;marker-end:url(#arrow)}
      .arrow-green{fill:none;stroke:#62e6ae;stroke-width:4;marker-end:url(#arrowGreen)}
    </style>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <text x="80" y="72" class="title">Portfolio Site — AWS Architecture</text>
  <text x="80" y="108" class="subtitle">2026-09-27 現在 / 実線は構築済み、破線は将来候補</text>

  <rect x="60" y="145" width="1480" height="390" rx="26" class="zone"/>
  <text x="90" y="184" class="label">PUBLIC DELIVERY PATH</text>

  <rect x="110" y="250" width="260" height="160" rx="18" class="box"/>
  <circle cx="165" cy="304" r="26" fill="#67d4ff"/>
  <path d="M145 350 Q165 325 185 350 M138 370 Q165 338 192 370" fill="none" stroke="#071a2d" stroke-width="7" stroke-linecap="round"/>
  <text x="215" y="300" class="h">閲覧者</text>
  <text x="215" y="334" class="t">Web Browser</text>
  <text x="215" y="365" class="small">HTTPS access</text>

  <rect x="550" y="220" width="390" height="220" rx="18" class="box"/>
  <rect x="585" y="260" width="76" height="76" rx="12" fill="#ff9900"/>
  <path d="M604 281 h38 v34 h-38z M595 293 h56 M623 269 v58" fill="none" stroke="#fff" stroke-width="5"/>
  <text x="690" y="278" class="h">Amazon CloudFront</text>
  <text x="690" y="314" class="t">CDN / HTTPS / Cache</text>
  <text x="590" y="365" class="small">GET・HEADのみ / HTTP→HTTPS</text>
  <text x="590" y="395" class="small">Default root: index.html / 圧縮有効</text>

  <rect x="1120" y="220" width="350" height="220" rx="18" class="box"/>
  <path d="M1165 273 q38-22 76 0 v75 q-38 22-76 0z M1165 273 q38 22 76 0 M1165 310 q38 22 76 0 M1165 348 q38-22 76 0" fill="#46a86b" stroke="#fff" stroke-width="4"/>
  <text x="1270" y="278" class="h">Amazon S3</text>
  <text x="1270" y="314" class="t">Private origin</text>
  <text x="1160" y="365" class="small">Public access: BLOCK_ALL</text>
  <text x="1160" y="395" class="small">SSE-S3 / TLS強制 / RETAIN</text>

  <path d="M370 330 H540" class="arrow"/>
  <text x="418" y="310" class="label">HTTPS</text>
  <path d="M940 330 H1110" class="arrow"/>
  <text x="980" y="295" class="label">OAC署名</text>
  <text x="970" y="318" class="small">GetObjectのみ</text>

  <rect x="60" y="565" width="1480" height="315" rx="26" class="zone"/>
  <text x="90" y="604" class="label green">DEPLOYMENT &amp; MANAGEMENT PATH</text>

  <rect x="110" y="655" width="300" height="145" rx="18" class="box deploy"/>
  <circle cx="165" cy="710" r="29" fill="#fff"/>
  <path d="M153 702 q12-14 24 0 q7 16-12 24 q-19-8-12-24z" fill="#17212b"/>
  <text x="215" y="700" class="h">GitHub Actions</text>
  <text x="215" y="735" class="t">main branch</text>
  <text x="150" y="775" class="small">lint → build → deploy</text>

  <rect x="520" y="635" width="330" height="185" rx="18" class="box deploy"/>
  <text x="560" y="680" class="h">GitHub OIDC</text>
  <text x="560" y="718" class="t">AWS STS</text>
  <text x="560" y="755" class="small">長期アクセスキーなし</text>
  <text x="560" y="783" class="small">repo + mainで信頼条件を限定</text>

  <rect x="960" y="635" width="480" height="185" rx="18" class="box deploy"/>
  <text x="1000" y="680" class="h">PortfolioSiteGitHubDeployRole</text>
  <text x="1000" y="720" class="t">S3 sync --delete</text>
  <text x="1000" y="755" class="t">CloudFront CreateInvalidation</text>
  <text x="1000" y="790" class="small">対象Bucket / Distributionだけに限定</text>

  <path d="M410 727 H510" class="arrow-green"/>
  <path d="M850 727 H950" class="arrow-green"/>
  <path d="M1300 635 C1300 560 1280 515 1280 450" class="arrow-green"/>
  <path d="M1100 635 C1030 555 850 540 790 450" class="arrow-green"/>

  <rect x="1200" y="60" width="310" height="88" rx="16" class="future"/>
  <text x="1230" y="98" class="t">将来: Route 53 + ACM</text>
  <text x="1230" y="126" class="small">独自ドメイン採用時に追加</text>

  <text x="80" y="925" class="small">IaC: AWS CDK → CloudFormation / PortfolioSiteStack　　CDK支援基盤: CDKToolkit</text>
</svg>
