name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ROLE_ARN: arn:aws:iam::947501356968:role/PortfolioSiteGitHubDeployRole
  SITE_BUCKET: portfoliositestack-sitebucket397a1860-zjcfwm36ko0g
  CLOUDFRONT_DISTRIBUTION_ID: E2B6RWLK35KKQ1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsPortfolioDeploy
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "947501356968"

      - name: Sync site to S3
        run: >-
          aws s3 sync dist "s3://${SITE_BUCKET}"
          --delete
          --region "${AWS_REGION}"
          --no-progress

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}"
          --paths "/*"
          --no-cli-pager
