<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">ポートフォリオサイトのAWS配信構成</title>
  <desc id="desc">閲覧者がRoute 53、CloudFrontを経由し、OACで保護された非公開S3バケットの静的ファイルへアクセスする構成。ACMがCloudFrontへTLS証明書を提供する。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17364d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#397da5"/>
    </marker>
    <style>
      .title { font: 700 30px 'Montserrat', 'Noto Sans JP', sans-serif; fill: #17364d; }
      .subtitle { font: 400 15px 'Noto Sans JP', sans-serif; fill: #637786; }
      .label { font: 700 18px 'Montserrat', 'Noto Sans JP', sans-serif; fill: #17364d; }
      .service { font: 700 19px 'Montserrat', sans-serif; fill: #232f3e; }
      .detail { font: 400 14px 'Noto Sans JP', sans-serif; fill: #637786; }
      .small { font: 600 12px 'Montserrat', 'Noto Sans JP', sans-serif; fill: #397da5; }
      .arrow { fill: none; stroke: #397da5; stroke-width: 3; marker-end: url(#arrow); }
      .support { fill: none; stroke: #9aabb6; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="640" rx="24" fill="#f7fafc"/>
  <text x="60" y="62" class="title">AWS Hosting Architecture</text>
  <text x="60" y="91" class="subtitle">React / Viteの静的ファイルを、安全な配信元とCDNで公開する採用案</text>

  <rect x="260" y="128" width="880" height="430" rx="28" fill="#ffffff" stroke="#d7e3ea" stroke-width="2"/>
  <rect x="292" y="108" width="136" height="40" rx="20" fill="#232f3e"/>
  <text x="360" y="134" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="15" font-weight="700" fill="#ffffff">AWS Cloud</text>

  <g filter="url(#shadow)">
    <rect x="52" y="264" width="160" height="116" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="132" cy="304" r="20" fill="#e7f3f9"/>
  <path d="M116 304h32M132 288c5 5 8 10 8 16s-3 11-8 16M132 288c-5 5-8 10-8 16s3 11 8 16M113 296h38M113 312h38" fill="none" stroke="#397da5" stroke-width="2"/>
  <text x="132" y="346" text-anchor="middle" class="label">閲覧者</text>
  <text x="132" y="368" text-anchor="middle" class="detail">Web browser</text>

  <g filter="url(#shadow)">
    <rect x="316" y="250" width="184" height="142" rx="18" fill="#ffffff" stroke="#ff9900" stroke-width="2"/>
  </g>
  <circle cx="408" cy="286" r="21" fill="#fff2df"/>
  <text x="408" y="292" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="18" font-weight="800" fill="#d67d00">53</text>
  <text x="408" y="328" text-anchor="middle" class="service">Route 53</text>
  <text x="408" y="352" text-anchor="middle" class="detail">DNS / 独自ドメイン</text>
  <text x="408" y="374" text-anchor="middle" class="small">OPTIONAL</text>

  <g filter="url(#shadow)">
    <rect x="570" y="250" width="208" height="142" rx="18" fill="#ffffff" stroke="#ff9900" stroke-width="2"/>
  </g>
  <circle cx="674" cy="286" r="21" fill="#fff2df"/>
  <path d="M662 286h24M674 274v24M665 277l18 18M683 277l-18 18" stroke="#d67d00" stroke-width="2.2" stroke-linecap="round"/>
  <text x="674" y="328" text-anchor="middle" class="service">CloudFront</text>
  <text x="674" y="352" text-anchor="middle" class="detail">CDN / HTTPS / 圧縮</text>
  <text x="674" y="374" text-anchor="middle" class="small">PUBLIC ENTRY POINT</text>

  <g filter="url(#shadow)">
    <rect x="882" y="250" width="208" height="142" rx="18" fill="#ffffff" stroke="#ff9900" stroke-width="2"/>
  </g>
  <path d="M964 272h44v30c0 11-44 11-44 0zM964 282c0 11 44 11 44 0M964 293c0 11 44 11 44 0" fill="#fff2df" stroke="#d67d00" stroke-width="2"/>
  <text x="986" y="328" text-anchor="middle" class="service">Amazon S3</text>
  <text x="986" y="352" text-anchor="middle" class="detail">静的ファイル / 非公開</text>
  <text x="986" y="374" text-anchor="middle" class="small">BLOCK PUBLIC ACCESS</text>

  <path d="M212 322H306" class="arrow"/>
  <text x="259" y="307" text-anchor="middle" class="small">HTTPS</text>
  <path d="M500 322H560" class="arrow"/>
  <path d="M778 322H872" class="arrow"/>
  <rect x="795" y="288" width="62" height="27" rx="13" fill="#e7f3f9"/>
  <text x="826" y="306" text-anchor="middle" class="small">OAC</text>

  <g filter="url(#shadow)">
    <rect x="570" y="448" width="208" height="78" rx="16" fill="#ffffff" stroke="#9aabb6" stroke-width="1.5"/>
  </g>
  <text x="674" y="480" text-anchor="middle" class="service">ACM</text>
  <text x="674" y="504" text-anchor="middle" class="detail">TLS証明書（us-east-1）</text>
  <path d="M674 448V402" class="support"/>

  <rect x="60" y="586" width="12" height="12" rx="3" fill="#ff9900"/>
  <text x="82" y="597" class="detail">AWSサービス</text>
  <line x1="206" y1="592" x2="242" y2="592" class="arrow"/>
  <text x="256" y="597" class="detail">リクエスト経路</text>
  <line x1="392" y1="592" x2="428" y2="592" class="support"/>
  <text x="442" y="597" class="detail">証明書の関連付け</text>
  <text x="1140" y="597" text-anchor="end" class="detail">S3への直接アクセスは不可</text>
</svg>
