<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">ポートフォリオサイトのCI/CDフロー</title>
  <desc id="desc">開発者がPull Requestを作成するとGitHub Actionsが依存関係のインストール、lint、buildを検証する。mainへのマージ後、OIDCでAWS IAMロールを引き受け、S3へ同期しCloudFrontのHTMLキャッシュを無効化する。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17364d" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#397da5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d8a5c"/>
    </marker>
    <style>
      .title { font: 700 30px 'Montserrat', 'Noto Sans JP', sans-serif; fill: #17364d; }
      .subtitle { font: 400 15px 'Noto Sans JP', sans-serif; fill: #637786; }
      .lane { font: 700 13px 'Montserrat', 'Noto Sans JP', sans-serif; letter-spacing: .1em; }
      .heading { font: 700 18px 'Montserrat', 'Noto Sans JP', sans-serif; fill: #17364d; }
      .detail { font: 400 14px 'Noto Sans JP', sans-serif; fill: #637786; }
      .small { font: 600 12px 'Montserrat', 'Noto Sans JP', sans-serif; fill: #397da5; }
      .arrow { fill: none; stroke: #397da5; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #2d8a5c; stroke-width: 3; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1500" height="760" rx="24" fill="#f7fafc"/>
  <text x="60" y="62" class="title">CI/CD Flow</text>
  <text x="60" y="91" class="subtitle">Pull Requestで品質を確認し、mainへのマージ後だけAWSへ自動デプロイ</text>

  <rect x="42" y="132" width="1416" height="238" rx="24" fill="#ffffff" stroke="#d7e3ea" stroke-width="2"/>
  <rect x="42" y="132" width="132" height="34" rx="17" fill="#e7f3f9"/>
  <text x="108" y="154" text-anchor="middle" class="lane" fill="#397da5">CI / VERIFY</text>

  <g filter="url(#shadow)">
    <rect x="82" y="207" width="170" height="102" rx="16" fill="#ffffff" stroke="#c9d8e1"/>
    <rect x="322" y="207" width="190" height="102" rx="16" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <rect x="582" y="190" width="286" height="136" rx="16" fill="#ffffff" stroke="#397da5" stroke-width="2"/>
    <rect x="938" y="207" width="200" height="102" rx="16" fill="#ffffff" stroke="#2d8a5c" stroke-width="2"/>
    <rect x="1208" y="207" width="190" height="102" rx="16" fill="#eaf7f0" stroke="#2d8a5c" stroke-width="2"/>
  </g>

  <circle cx="167" cy="238" r="17" fill="#e7f3f9"/>
  <circle cx="167" cy="233" r="6" fill="#397da5"/>
  <path d="M153 258c2-10 26-10 28 0" fill="#397da5"/>
  <text x="167" y="285" text-anchor="middle" class="heading">開発者</text>

  <path d="M395 230h32v26c0 14-32 14-32 0z" fill="#24292f"/>
  <circle cx="402" cy="245" r="3" fill="#ffffff"/>
  <circle cx="420" cy="245" r="3" fill="#ffffff"/>
  <text x="417" y="285" text-anchor="middle" class="heading">Pull Request</text>

  <text x="725" y="220" text-anchor="middle" class="heading">GitHub Actions</text>
  <rect x="612" y="239" width="226" height="56" rx="10" fill="#eef5f8"/>
  <text x="725" y="260" text-anchor="middle" class="detail">npm ci → lint → build</text>
  <text x="725" y="282" text-anchor="middle" class="small">QUALITY GATE</text>

  <circle cx="1038" cy="241" r="17" fill="#eaf7f0"/>
  <path d="M1029 241l6 6 12-14" fill="none" stroke="#2d8a5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1038" y="285" text-anchor="middle" class="heading">レビュー</text>

  <text x="1303" y="250" text-anchor="middle" class="heading">main</text>
  <text x="1303" y="278" text-anchor="middle" class="detail">merge / push</text>

  <path d="M252 258H312" class="arrow"/>
  <path d="M512 258H572" class="arrow"/>
  <path d="M868 258H928" class="arrow"/>
  <path d="M1138 258H1198" class="arrow-green"/>

  <rect x="42" y="408" width="1416" height="298" rx="24" fill="#ffffff" stroke="#d7e3ea" stroke-width="2"/>
  <rect x="42" y="408" width="154" height="34" rx="17" fill="#fff2df"/>
  <text x="119" y="430" text-anchor="middle" class="lane" fill="#d67d00">CD / DEPLOY</text>

  <g filter="url(#shadow)">
    <rect x="96" y="500" width="226" height="126" rx="16" fill="#ffffff" stroke="#397da5" stroke-width="2"/>
    <rect x="392" y="500" width="214" height="126" rx="16" fill="#ffffff" stroke="#ff9900" stroke-width="2"/>
    <rect x="676" y="500" width="214" height="126" rx="16" fill="#ffffff" stroke="#ff9900" stroke-width="2"/>
    <rect x="960" y="500" width="214" height="126" rx="16" fill="#ffffff" stroke="#ff9900" stroke-width="2"/>
    <rect x="1244" y="500" width="154" height="126" rx="16" fill="#eaf7f0" stroke="#2d8a5c" stroke-width="2"/>
  </g>

  <text x="209" y="536" text-anchor="middle" class="heading">Deploy Workflow</text>
  <text x="209" y="565" text-anchor="middle" class="detail">main更新時のみ実行</text>
  <text x="209" y="591" text-anchor="middle" class="small">GITHUB ACTIONS</text>

  <text x="499" y="536" text-anchor="middle" class="heading">OIDC / IAM</text>
  <text x="499" y="565" text-anchor="middle" class="detail">一時認証情報を取得</text>
  <text x="499" y="591" text-anchor="middle" class="small">NO ACCESS KEY</text>

  <text x="783" y="536" text-anchor="middle" class="heading">Amazon S3</text>
  <text x="783" y="565" text-anchor="middle" class="detail">distを同期</text>
  <text x="783" y="591" text-anchor="middle" class="small">ASSETS → HTML</text>

  <text x="1067" y="536" text-anchor="middle" class="heading">CloudFront</text>
  <text x="1067" y="565" text-anchor="middle" class="detail">index.htmlを無効化</text>
  <text x="1067" y="591" text-anchor="middle" class="small">INVALIDATION</text>

  <circle cx="1321" cy="540" r="19" fill="#2d8a5c"/>
  <path d="M1312 540l6 6 13-15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1321" y="580" text-anchor="middle" class="heading">公開完了</text>
  <text x="1321" y="603" text-anchor="middle" class="detail">HTTPS</text>

  <path d="M1303 309V390Q1303 420 1273 420H239Q209 420 209 450V490" class="arrow-green"/>
  <text x="758" y="440" text-anchor="middle" class="small">main更新をトリガー</text>
  <path d="M322 563H382" class="arrow"/>
  <path d="M606 563H666" class="arrow"/>
  <path d="M890 563H950" class="arrow"/>
  <path d="M1174 563H1234" class="arrow-green"/>

  <text x="60" y="735" class="detail">失敗時は処理を停止し、GitHub Actionsのログから原因を確認。正常だったコミットを再実行して復旧する。</text>
</svg>
